[package]
name = "pdf-presenter-mode"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Presenter console for PDF slide decks"
license = "MIT"
publish = false

[[bin]]
name = "ppm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence", "wayland"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
hayro = "0.9"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
log = "0.4.35"
# The XDG portal backend only. The wayland feature parents the dialog, which needs a window handle on its thread.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# For the idle inhibitor. winit already builds both, with these features.
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
winit = "0.30"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Unoptimized hayro renders about 50 times slower.
[profile.dev.package."*"]
opt-level = 3
