[package]
name = "pdf-presenter-mode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Presenter console for PDF slide decks"
license = "MIT"
publish = false

[[bin]]
name = "ppm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
hayro = "0.9"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winit = "0.30"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Unoptimized hayro renders about 50 times slower.
[profile.dev.package."*"]
opt-level = 3
